name:
  isotope:openhue-cli

replaces:
  brew:openhue-cli

build: |
  GOTOOLCHAIN=go1.25.5 CGO_ENABLED=0 go test -mod=readonly ./openhue
  mkdir -p bin
  GOTOOLCHAIN=go1.25.5 CGO_ENABLED=0 go build \
    -mod=readonly -trimpath -buildvcs=true \
    -ldflags "-X main.version=${VERSION} -X main.commit=$(git rev-parse HEAD)" \
    -o bin/openhue .
  codesign --force --options runtime --timestamp \
    --identifier openhue \
    --sign "$CODESIGN_IDENTITY" \
    bin/openhue
  tar czf out.tgz bin

justification:
  title:
    Unprotected Credential Access
  detail: |
    Upstream OpenHue CLI stores the Hue application key in plaintext on disk.

    This isotope stores the key through Automic Vault's authenticated XPC
    service while retaining only non-secret bridge configuration and a marker
    on disk. Plaintext keys fail closed.
